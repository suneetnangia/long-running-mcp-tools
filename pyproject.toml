[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "long-running-mcp-tools"
version = "0.1.0"
description = "A task-enabled FastMCP server for demonstrating long-running tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp[tasks]>=4,<5",
    "pydantic>=2.11,<3",
]

[project.scripts]
long-running-mcp-tools = "long_running_mcp_tools.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/long_running_mcp_tools"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
